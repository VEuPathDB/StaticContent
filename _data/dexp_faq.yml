- type: upload 
  question: "What information do I need to provide when uploading a dataset?"
  answer: |
           To upload a dataset for private use, you will need to provide:
           - A data file in .csv, .tsv, or tab-delimited .txt format (variables as columns and records as rows)
           - A dataset name
           - A brief summary (up to 400 characters)
           
           To make your dataset publicly accessible for reuse by the broader research community, you will also need to provide:
           - A variable attributes file in .csv, .tsv, or tab-delimited .txt format, that contains the following columns: 
             - <b>variable</b>: the variable name, exactly as it appears in the data file
             - <b>label</b>: a human-readable name displayed throughout the website to help users identify and understand the variable
             - <b>definition</b>: a description for each variable

           - Core dataset information to establish provenance and context, including:
             - Principal Investigator and collaborator information
             - Field study or clinical trial details (e.g., study design, outcomes of interest, if applicable)
             - Information about any external data sources
             - Reuse considerations (e.g., missing data, potential biases, or other limitations that may affect interpretation or reuse)
             
             This additional information is not required for private datasets or those shared directly with collaborators, but providing it will improve clarity, usability, and reuse.
  uid: u4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: upload 
  question: "Can I upload a dataset that is not yet published?"
  answer: |
           Yes! If you are still analyzing your data or preparing a manuscript, you can privately upload your dataset to dataExplorer. Dataset visibility is restricted to you and collaborators you explicitly invite.
           
           Uploading your dataset during the analysis phase allows you to organize and explore your data, identify data errors, collaborate with co-authors, and prepare for public release. You can include the dataset’s stable identifier in your manuscript and update the dataset’s visibility when you are ready to share it.
  uid: u5
  projects: "ClinEpiDB,AllClinEpiDB"
- type: upload 
  question: "Can I delete my dataset?"
  answer: |
           Yes! You can delete your dataset at any time. Click <b>Manage My Datasets</b> under the <b>Workspace</b> menu in the website header. From there, select the dataset you want to delete and click on the <b>Delete</b> button on the upper right side of the table. 
  uid: u6
  projects: "ClinEpiDB,AllClinEpiDB"
- type: sharing 
  question: "How do I manage who can access my dataset?"
  answer: |
           All datasets are <b>private by default</b> and visible only to the dataset owner.
           
           You can manage access to your dataset directly within dataExplorer. Open <b>Manage My Datasets</b> from the <b>Workspace</b> menu in the website header, select a dataset, and click the <b>Manage Access</b> button on the upper right side of the table.
           
           From there, you can choose between two access levels:
           - <b>Individual Access</b> – Grant access to specific collaborators, who will be able to view, explore, and download your private dataset.
           - <b>Public Access</b> – Make the dataset discoverable by the broader research community. Datasets that have been granted public access immediately become visible in the dataExplorer dataset catalog and can be explored and downloaded by other users of the platform.
  uid: s1
  projects: "ClinEpiDB,AllClinEpiDB"
- type: sharing 
  question: "How do I determine an appropriate access level for my dataset?"
  answer: |
           Dataset contributors decide who can discover, explore, and download their datasets on dataExplorer.
           - <b>Private datasets</b> are accessible only to the dataset owner and collaborators whom the owner explicitly invites via Individual access.
           - <b>Public datasets</b> are discoverable, explorable, and downloadable by the broader research community.
           
           When choosing an access level, contributors should consider factors such as participant consent, IRB requirements, institutional or funder data-sharing policies, and the status of related analyses or manuscripts (for example, whether results are still being analyzed or the primary manuscript has already been published).
  uid: s2
  projects: "ClinEpiDB,AllClinEpiDB"
- type: sharing 
  question: "Can I change my dataset’s access level later?"
  answer: |
           Yes! You can change your dataset’s access level at any time. Many contributors keep datasets private during analysis and manuscript preparation, and then make them accessible to the community after publication. Public datasets can also be made private again if needed.
  uid: s3
  projects: "ClinEpiDB,AllClinEpiDB"
- type: sharing 
  question: "Do I have to make my dataset accessible to the community after uploading it?"
  answer: |
           No! dataExplorer never requires datasets to be made public. You can keep your dataset private and use dataExplorer’s tools to organize, explore, and analyze your data.
  uid: s4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: explore 
  question: "How can I find datasets relevant to my research?"
  answer: |
           You can search for datasets using the search bar in the dataExplorer site header. Enter a keyword related to your topic of interest, and the search will return results from datasets your account has access to: those you own, datasets shared with you, and community-contributed datasets. Private datasets owned by others that have not been shared with you will not appear in search results.
           
           Your search will return:
           - <b>Datasets</b> that contain the term in their name or description
           - <b>Variables</b> that include the term in the variable name, definition, or other metadata

           Variable values are not included in the search at this time.
           
           Each result links directly to the dataset or variable, allowing you to quickly explore metadata, summary statistics, and distributions to determine whether a dataset is relevant to your research.
           
           To broaden your results, try searching for synonyms or related terms.
  uid: e1
  projects: "ClinEpiDB,AllClinEpiDB"
- type: explore 
  question: "How can I understand and explore the variables in a dataset?"
  answer: |
           Data dictionaries are essential for making datasets interpretable, reusable, and reproducible, especially for researchers who were not involved in generating the data.
           
           In dataExplorer, variables are documented using a variable attributes file that the data provider uploads alongside their dataset. For each variable, the data provider supplies a human-readable label and definition in addition to the original variable name (the column header in their uploaded data file).
           
           This information is used by dataExplorer to generate an interactive data dictionary for the dataset. Instead of viewing variable documentation in a static spreadsheet or PDF, users can:
           - Browse and search variables
           - View variable definitions and value categories
           - Explore distributions and summary statistics for continuous variables
           - Examine value frequencies for categorical variables
           - Assess data completeness and structure
           
           Users can also subset the data and instantly see how their selections affect other variables. As filters are applied, distributions, frequencies, and summary statistics update in real time, making it easy to explore relationships between variables, identify patterns, and quickly assess whether a dataset contains data relevant to a research question.
  uid: e2
  projects: "ClinEpiDB,AllClinEpiDB"
- type: explore 
  question: "Can I export visualizations or analyses created in dataExplorer?"
  answer: |
           Yes! Visualizations can be exported in SVG or PNG format using the <b>Export plot</b> button in the lower right corner of each plot.
           
           You can also generate a shareable URL for any analysis by clicking the <b>Share Analysis</b> button in the top right of the dataset workspace. This link can be shared with collaborators or included in manuscripts. Opening the link creates a copy of the analysis in the recipient’s account, allowing them to modify parameters and explore further.
  uid: e3
  projects: "ClinEpiDB,AllClinEpiDB"
- type: explore 
  question: "Can I download datasets for offline analysis?"
  answer: |
           Yes! You can download any dataset your account has access to. We recommend using dataExplorer’s tools for exploration and visualization, and performing more advanced analyses—such as statistical modeling—offline. Please make sure to cite the dataset and dataExplorer in your manuscript.
  uid: e4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: cite 
  question: "How should datasets hosted on dataExplorer be cited?"
  answer: |
           When citing a dataset that you accessed via dataExplorer, you can use the “Copy citation” button on the <b>Download</b> tab of a dataset. Please include the authors, dataset name, date of release and release number on dataExplorer, study page URL, and the fact that the data came from dataExplorer. For example, the citation for the <b><i>A. lumbricoides</i> burden in Ethiopia, 2022</b> dataset would be:
           
           Toby Landeryou, Roy Anderson, Ufaysa Angulo, et al. Dataset: A. lumbricoides burden in Ethiopia, 2022. dataExplorer. 2026-06-26, v1 (https://dataexplorer.org/dexp/app/workspace/analyses/EDAUD_VcJ5w1Zdl50pJ/new/)

           You can also find links to original publications using the dataset on the <b>View Dataset Details</b> tab, which you may also want to cite.
  uid: c1
  projects: "ClinEpiDB,AllClinEpiDB"
- type: cite 
  question: "Will my dataset receive a persistent identifier?"
  answer: |
           Yes! Each dataset is assigned their own stable identifier that begins with ‘EDAUD_’. This identifier is present in all URLs associated with that dataset, and should be included when citing the dataset.
