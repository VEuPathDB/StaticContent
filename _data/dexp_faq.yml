- type: getting_started
  question: "Do I need a VEuPathDB account to upload or explore datasets?"
  answer: |
           Yes. A free VEuPathDB account is required to upload a dataset, access datasets privately shared with you, explore data in the analysis workspace, or save analyses.
           
           To create an account, [visit the registration page](https://dataexplorer.org/dexp/app/user/registration){:target='_blank'}, or follow these instructions from any page on dataExplorer:

           1. Hover over the <b>Guest</b> icon in the upper-right corner of the page and click <b>Register</b>.
           2. Complete the registration form and click <b>Register</b>.
           3. A confirmation message will appear indicating that registration was successful.
           4. Check your email to retrieve your temporary password.
           
           You only need <b>one account for all VEuPathDB websites</b>. If you already have an account for another VEuPathDB resource, such as ClinEpiDB, PlasmoDB, or MicrobiomeDB, you can use the same credentials to log in to dataExplorer and other VEuPathDB sites.
  uid: g4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: getting_started
  question: "How can I change the password associated with my VEuPathDB account?"
  answer: |
           To change your password:
           1. Log in to your account.
           2. Hover over the <b>account icon</b> in the upper-right corner of the page (labeled <b>Guest</b> before login and your <b>username</b> after login) and click <b>My Account</b>.
           3. In the left panel, click <b>Security</b>.
           4. Click <b>Change your password</b> and follow the instructions.
