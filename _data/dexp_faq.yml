- type: upload 
  question: "What types of datasets can I upload to dataExplorer?"
  answer: |
           dataExplorer supports any dataset that can be represented as a flat file (i.e., a single data table), regardless of whether the data comes from the life sciences, environmental studies, business analytics, or any other field. 
  uid: u1
  projects: "ClinEpiDB,AllClinEpiDB"
- type: upload 
  question: "How should I structure my data files?"
  answer: |
         Each file should include a single data table structured around a single primary observational unit, with one row per instance of that unit (e.g., one household, one participant, or one sample per row). Every variable should contain only one value per row.
         
         To avoid redundancy, store information at the appropriate observational level. For example, household-level data should be stored in a household table rather than repeated across multiple rows in a participant-level table. However, if all variables maintain a 1:1 relationship with the primary observational unit, related (child-level) data does not need to be split into a separate table.
         
         Each data table should be uploaded as a separate dataset. Studies composed of multiple linked tables (e.g., households, participants, and samples within a single study) are not currently supported as a single dataset, but this capability is planned for future development.
  uid: u2
  projects: "ClinEpiDB,AllClinEpiDB"
