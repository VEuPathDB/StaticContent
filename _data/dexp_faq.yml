- type: technical 
  question: "Is dataExplorer a data repository?"
  answer: |
           dataExplorer is a knowledgebase that makes data more FAIR (findable, accessible, interoperable, and reusable). While datasets can be accessed, explored, and downloaded from our website, we also recommend depositing your data in a formal repository such as [Synapse](https://www.synapse.org/){:target='_blank'} or [Harvard Dataverse](https://dataverse.harvard.edu/){:target='_blank'} to ensure long-term preservation.
  uid: t2
  projects: "ClinEpiDB,AllClinEpiDB"
- type: technical 
  question: "How does dataExplorer ensure long-term preservation of datasets?"
  answer: |
           UDatasets hosted on dataExplorer are preserved as part of the VEuPathDB infrastructure. The platform is supported by production servers located at the University of Pennsylvania and mirrored at partner institutions, including the University of Georgia, to provide redundancy and ensure reliable uptime.
           
           All systems are housed in secure, FISMA-compliant computational facilities, and regular industry-standard backups are performed to protect data integrity. If the platform were ever to close, reasonable efforts would be made to maintain the site for an additional three years and to rehouse datasets in an appropriate long-term repository where possible.
  uid: t3
  projects: "ClinEpiDB,AllClinEpiDB"
- type: technical 
  question: "Does dataExplorer harmonize variables across datasets?"
  answer: |
           Unlike ClinEpiDB, dataExplorer does not currently use ontologies to harmonize variable labels across datasets. However, the platform is built on the same infrastructure as ClinEpiDB, where variables are mapped to terms in the VEuPathDB ontology to improve data interoperability. We plan to introduce AI-assisted tools for variable harmonization in a future version of dataExplorer.
  uid: t4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: technical 
  question: "Can I access the code used for dataExplorer?"
  answer: |
           Yes! Our code is maintained using [Git](https://github.com/VEuPathDB){:target='_blank'}, and we welcome input from the community.
  uid: t5
