- type: data_govern 
  question: "How can dataExplorer support compliance with Data Management & Sharing Policies?"
  answer: |
           The U.S. National Institutes of Health (NIH) Data Management & Sharing Policy requires all funded projects to include an approved Data Management & Sharing (DMS) Plan. Similar data sharing expectations are increasingly required by funders, publishers, and research institutions worldwide.
           
           dataExplorer can support these requirements by providing a platform for organizing, documenting, exploring, and sharing structured datasets in a FAIR-aligned environment. Researchers can control access to their data, share datasets with collaborators or the broader community, and provide the metadata and contextual information needed to support reuse.
           
           We have developed guidance for researchers interested in using dataExplorer to enable access to clinical, field, and epidemiological datasets in alignment with NIH and other data sharing requirements.
  uid: dg1
  projects: "ClinEpiDB,AllClinEpiDB"
- type: data_govern 
  question: "Do I need IRB approval to share my dataset?"
  answer: |
           Yes. If you plan to share data through dataExplorer, this should be described in your IRB proposal and reflected in your participant consent forms. Our IRB data sharing guidance document provides a brief overview of considerations for including data sharing in your IRB submission.
  uid: dg2
  projects: "ClinEpiDB,AllClinEpiDB"
- type: data_govern 
  question: "What if my consent form did not include data sharing?"
  answer: |
           If your consent form does not permit data sharing, you should not share those data beyond your private workspace in dataExplorer. While datasets you upload are private by default and not accessible to others, any decision to share data with collaborators or make it publicly available must be consistent with the informed consent provided by participants and any applicable IRB or ethics approvals.
           
           In some cases, you may be able to share de-identified or aggregated data, or seek guidance from your IRB about whether limited sharing is permissible under your original consent. You may also consider updating consent language for future studies to allow for responsible data sharing.
           
           If you are unsure, consult your institution’s IRB or ethics committee before sharing data.
  uid: dg3
  projects: "ClinEpiDB,AllClinEpiDB"
- type: data_govern 
  question: "Who is responsible for removing Personally Identifiable Information (PII) from datasets?"
  answer: |
           Personally Identifiable Information (PII) must not be uploaded to or stored in dataExplorer.
           
           Dataset contributors are expected to ensure that all uploaded data have been appropriately de-identified and comply with applicable ethical, institutional, and regulatory requirements before uploading to the platform. Direct identifiers (such as names) must be removed, and indirect identifiers (such as dates or precise locations) should be generalized or obfuscated when necessary to protect participant privacy.
           
           If you encounter a dataset on dataExplorer that appears to contain PII, please [<b>Contact Us</b>](https://dataexplorer.org/dexp/app/contact-us){:target='_blank'} so we can review and remove it promptly.
  uid: dg4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: data_govern 
  question: "How does dataExplorer protect human subject data?"
  answer: |
           Use of dataExplorer constitutes agreement to our [<b>Data Access and Use Policy</b>](https://dataexplorer.org/dexp/app/static-content/dataExplorer/access_and_use.html){:target='_blank'}.
           
           dataExplorer supports multiple data access levels to help protect human subject privacy. Contributors can choose whether datasets remain private, are shared only with approved collaborators, or made accessible to the broader research community.
  uid: dg5
  projects: "ClinEpiDB,AllClinEpiDB"
