- type: upload 
  question: "What information do I need to provide when uploading a dataset?"
  answer: |
           To upload a dataset for private use, you will need to provide:
           - A data file in .csv, .tsv, or tab-delimited .txt format (variables as columns and records as rows)
           - A dataset name
           - A brief summary (up to 400 characters)
           
           To share your dataset as a community-contributed dataset, you will also need to provide:
           - A variable annotation file in .csv, .tsv, or tab-delimited .txt format, that contains the following columns: 
             - <b>variable</b>: the variable name, exactly as it appears in the data file
             - <b>label</b>: a human-readable name displayed throughout the website to help users identify and understand the variable
             - <b>definition</b>: a description for each variable

           - Core dataset information to establish provenance and context, including:
             - Principal Investigator and collaborator information
             - Field study or clinical trial details (e.g., study design, outcomes of interest, if applicable)
             - Information about any external data sources
             - Reuse considerations (e.g., missing data, potential biases, or other limitations that may affect interpretation or reuse)
             
             This additional information is not required for private datasets or those shared only with collaborators, but providing it will improve clarity, usability, and reuse.
  uid: u4
  projects: "ClinEpiDB,AllClinEpiDB"
- type: upload 
  question: "Can I upload a dataset that is not yet published?"
  answer: |
           Yes! If you are still analyzing your data or preparing a manuscript, you can privately upload your dataset to dataExplorer. Dataset visibility is restricted to you and collaborators you explicitly invite.
           
           Uploading your dataset during the analysis phase allows you to organize and explore your data, identify data errors, collaborate with co-authors, and prepare for public release. You can include the dataset’s stable identifier in your manuscript and update the dataset’s visibility when you are ready to share it.
  uid: u5
  projects: "ClinEpiDB,AllClinEpiDB"
- type: upload 
  question: "Can I delete my dataset?"
  answer: |
           Yes! You can delete your dataset at any time. Click Manage My Datasets under the Workspace menu in the website header. From there, select the dataset you want to delete and click on the Delete button on the upper right side of the table. 
  uid: u6
  projects: "ClinEpiDB,AllClinEpiDB"